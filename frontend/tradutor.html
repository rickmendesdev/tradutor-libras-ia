<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Tradutor — Gestta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="gestta.css">
</head>

<body>

  <header>
    <a href="gestta.html" class="logo">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v0"/>
        <path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2"/>
        <path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"/>
        <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>
      </svg>
      <strong>Gestta</strong>
    </a>

    <nav aria-label="Principal">
      <a href="gestta.html">Início</a>
      <a href="sobre.html">Sobre</a>
      <a class="botao" href="tradutor.html" aria-current="page">Começar</a>
    </nav>
  </header>

  <main class="main-tradutor">

    <div class="topo-tradutor">
      <h1>Tradutor em Tempo Real</h1>
      <p>Clique em <strong>Iniciar Tradução</strong>, permita a câmera e faça um dos sinais cadastrados.</p>
    </div>

    <section id="tradutor">

      <div class="painel">
        <h2>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
            <circle cx="12" cy="13" r="3"/>
          </svg>
          Câmera
        </h2>

        <div class="video-caixa">
          <video id="video" playsinline muted></video>
          <p id="video-vazio">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
              <circle cx="12" cy="13" r="3"/>
            </svg>
            <span>Sua câmera será ativada aqui</span>
          </p>
        </div>

        <div class="acoes-camera">
          <button id="btn-iniciar">Iniciar Tradução</button>
          <button id="btn-parar" class="botao-parar" disabled>Parar</button>
        </div>
      </div>

      <div class="painel">
        <h2>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m5 8 6 6"/>
            <path d="m4 14 6-6 2-3"/>
            <path d="M2 5h12"/>
            <path d="M7 2h1"/>
            <path d="m22 22-5-10-5 10"/>
            <path d="M14 18h6"/>
          </svg>
          Tradução
        </h2>

        <div id="saida">
          <p>Faça um sinal em Libras...</p>
        </div>
      </div>

    </section>

  </main>

  <footer>
    <p><strong>Gestta</strong> © 2026 | Tecnologia que aproxima pessoas.</p>
    <ul>
      <li><a href="https://github.com/rickmendesdev/tradutor-libras-ia.git" target="_blank" rel="noopener noreferrer">GitHub</a></li>
      <li><a href="sobre.html">Sobre o projeto</a></li>
    </ul>
  </footer>

  <script src="script.js"></script>
</body>
</html>
